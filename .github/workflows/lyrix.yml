name: Lyrix app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/lyrix.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/lyrix.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lyrix-${{ runner.os }}
          path: |
            app/target/release/lyrix
            app/target/release/lyrix.exe
          if-no-files-found: error

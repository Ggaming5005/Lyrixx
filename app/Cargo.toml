[workspace]
members = [".", "desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"

[package]
name = "lyrix"
version.workspace = true
edition = "2021"
rust-version = "1.80"
description = "Turns whatever you're listening to into a live status, with synced lyrics."
license = "MIT"
repository = "https://github.com/Ggaming5005/Lyrixx"

[lib]
name = "lyrix"
path = "src/lib.rs"

[[bin]]
name = "lyrix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util", "process", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT"] }
windows-future = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

# Shared by the CLI and the desktop app (a workspace's profiles live here).
# Tauri's own size guide recommends these settings, `panic = "abort"` included.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "lyrix-desktop"
version.workspace = true
edition = "2021"
description = "The Lyrix desktop app: a window and a tray icon around the Lyrix engine."
license = "MIT"
repository = "https://github.com/Ggaming5005/Lyrixx"
publish = false

# Not `lyrix`: on case-insensitive file systems that would collide with the
# CLI binary in the shared target folder.
[[bin]]
name = "lyrix-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lyrix = { path = ".." }
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
